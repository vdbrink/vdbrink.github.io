# Site settings
lang: "en"
title: vd Brink Home Automations
description: "Home automations with Home Assistant, ESPHome, Node-RED and more tech"
url: "https://vdbrink.github.io"
logo: /images/avatar_square.jpg
author:
  name: Ronald vd Brink
facebook:
  publisher: https://www.facebook.com/brinkhomeautomations
social:
  type: Person
  name: Ronald vd Brink
  links:
    - https://github.com/vdbrink
    - https://www.facebook.com/brinkhomeautomations

defaults:
  - scope:
      path: "" # Alle bestanden in de root en submappen
    values:
      layout: "default"
  - scope:
      path: "" # default social/search image for pages without their own image:
    values:
      image: /images/avatar.jpg

# Layout settings (geen extra spaties vooraan!)
layouts_dir: _layouts

# Markdown & Syntax
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Plugins (Let op de exacte naam van de tagging plugin)
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll/tagging
  - jekyll-gist
  - jekyll-seo-tag
  - jekyll-last-modified-at
  - webrick
  - jekyll-github-metadata

tagging:
  layout: default
  dir: tags
  permalink: /tag/:name/

# Zorg dat dit blok helemaal aan het begin van een regel staat (0 spaties)
sass:
  quiet_deps: true
  style: compressed

# Readable names for URL folders, used by the BreadcrumbList JSON-LD (_includes/jsonld.html)
breadcrumb_names:
  homeassistant: Home Assistant
  esphome: ESPHome
  zigbee: Zigbee
  node-red: Node-RED
  desk: Home office
  buy: Best buy tips
  projects: Projects
  frigate: Frigate
  proxmox: Proxmox
  docker: Docker
  elgato_stream_deck: Stream Deck
  ideas: Ideas
  jura: Jura
  matter: Matter
  mealie: Mealie
  magicmirror: MagicMirror
  pihole: Pi-hole
  rhasspy: Rhasspy
  ollama: Ollama
  ai: AI
  android: Android
  mac: Mac
  windows: Windows
  tasker: Tasker
  hardware_hacks: Hardware hacks
  smarthomeserver: Smart home server
  github_pages: GitHub Pages
  home_automation_categories: Home automation categories
  shop: Shop

last-modified-at:
  date-format: 'last modified: %d/%b/%y'

google_analytics: G-WTTK5G664M

# Exclusies
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - TODO.md
  - preview.*
  - .jekyll-cache
  - _site
  - schemas
