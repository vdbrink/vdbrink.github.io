# yaml-language-server: $schema=../../../schemas/streamdeck-category.schema.json
title: Google Mail
key: google_mail
priority: 45
description: The Stream Deck can be used with navigate within Google Mail.<br>
  With Gmail's <a href="https://support.google.com/mail/answer/6594?sjid=1880908167833626818-EU&hl=en">keyboard shortcuts enabled</a>, with a keyboard shortcut you can search, compose a new email,
  go to your inbox or drafts, or open a label.
dependencies:
  - plugin: none
    actions:
      - name: Filter by unread email
        icon: 1
        download: google_mail_unread_messages-vdbrink.streamDeckAction
        type: (Elgato) Multi Action
        fields:
          - key: Step 1
            value: ⇧ G
          - key: Step 2
            value: ⇧ L
          - key: Step 3
            value: unread
          - key: Step 4
            value: Enter
      - name: Filter by spam email
        icon: 1
        download: google_mail_in_spam-vdbrink.streamdeckaction
        type: (Elgato) Multi Action
        fields:
          - key: Step 1
            value: ⇧ G
          - key: Step 2
            value: ⇧ L
          - key: Step 3
            value: Spam
          - key: Step 4
            value: Enter
      - name: Search mail
        icon: google_mail
        download: google_mail_search-vdbrink.streamDeckAction
        type: (System) Hotkey
        fields:
          - key: Title
            value: search
          - key: Hotkey
            value: /
      - name: Compose a new email
        icon: google_mail
        download: google_mail_compose-vdbrink.streamDeckAction
        type: (System) Hotkey
        fields:
          - key: Title
            value: compose
          - key: Hotkey
            value: ⇧ C
      - name: "Go to Inbox"
        icon: 1
        download: gmail_to_inbox-vdbrink.streamDeckAction
        type: (Elgato) Multi Action
        fields:
          - key: Step 1
            value: ⇧ G
          - key: Step 2
            value: I
      - name: Go to Drafts
        icon: 1
        download: google_mail_draft-vdbrink.streamdeckaction
        type: (Elgato) Multi Action
        fields:
          - key: Step 1
            value: ⇧ G
          - key: Step 2
            value: D
      - name: Go to Sent mails
        icon: 1
        download: google_mail_sent-vdbrink.streamdeckaction
        type: (Elgato) Multi Action
        fields:
          - key: Step 1
            value: ⇧ G
          - key: Step 2
            value: T
      - name: "Open any label ('gitlab' as example)"
        icon: 1
        download: google_mail_label_gitlab-vdbrink.streamDeckAction
        type: (Elgato) Multi Action
        fields:
          - key: Step 1
            value: ⇧ G
          - key: Step 2
            value: ⇧ L
          - key: Step 3
            value: gitlab
          - key: Step 4
            value: Enter
    wishes:
      - name: Show the number of new inbox emails
      - name: Show the number of emails for a specific label
footnote: First you need the keyboard shortcuts to be enabled, this is not the default. Thhen check this big list of <a href="https://support.google.com/mail/answer/6594?hl=en">Gmail keyboard shortcuts</a> you can map to your Stream Deck keys. You can use one of the above as example.
