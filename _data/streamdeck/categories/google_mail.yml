title: Google Mail
key: google_mail
priority: 70
description: The Stream Deck can be used with Google Mail to quickly filter by specific labels.
dependencies:
  - plugin: none
    actions:
      - name: Filter by unread email
        icon: google_mail
        download: google_mail_label_unread-vdbrink.streamDeckAction
        type: (System) Text
        fields:
          - key: Title
            value: "label:unread"
          - key: Text
            value: "label:unread"
      - name: Filter by a specific label ('gitlab' here)
        icon: google_mail
        download: google_mail_label_any-vdbrink.streamDeckAction
        type: (System) Text
        fields:
          - key: Title
            value: "label:gitlab"
          - key: Text
            value: "label:gitlab"
      - name: Filter by spam email
        icon: google_mail
        download: google_mail_in_spam-vdbrink.streamdeckaction
        type: (System) Text
        fields:
          - key: Title
            value: "in:spam"
          - key: Text
            value: "in:spam"
    wishes:
      - name: Show the number of new inbox emails
      - name: Show the number of emails for a specific label