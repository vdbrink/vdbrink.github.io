title: Google Mail
key: google_mail
priority: 70
description: The Stream Deck can be used with Google Mail to quickly filter by specific labels.<br>
  With Gmail's <a href="https://support.google.com/mail/answer/6594?sjid=1880908167833626818-EU">keyboard shortcuts enabled</a>, a single key press can also search, compose a new email,
  go to your inbox or drafts, or open a label.
dependencies:
  - plugin: none
    actions:
      - name: Filter by unread email
        icon: google_mail
        download: google_mail_label_unread-vdbrink.streamDeckAction
        type: (System) Text
        fields:
          - key: Title
            value: "label:unread"
          - key: Text
            value: "label:unread"
      - name: Filter by a specific label ('gitlab' here)
        icon: google_mail
        download: google_mail_label_any-vdbrink.streamDeckAction
        type: (System) Text
        fields:
          - key: Title
            value: "label:gitlab"
          - key: Text
            value: "label:gitlab"
      - name: Filter by spam email
        icon: google_mail
        download: google_mail_in_spam-vdbrink.streamdeckaction
        type: (System) Text
        fields:
          - key: Title
            value: "in:spam"
          - key: Text
            value: "in:spam"
      - name: Search mail
        icon: google_mail
        type: (System) Hotkey
        fields:
          - key: Title
            value: search
          - key: Hotkey
            value: /
      - name: Compose a new email
        icon: google_mail
        type: (System) Hotkey
        fields:
          - key: Title
            value: compose
          - key: Hotkey
            value: C
      - name: "Go to Inbox (shortcut: g,i)"
        icon: 1
        download: gmail_to_inbox-vdbrink.streamDeckAction
        type: (Elgato) Multi Action
        fields:
          - key: Step 1
            value: G
          - key: Step 2
            value: I
      - name: Go to Drafts
        icon: 1
        download: google_mail_draft-vdbrink.streamdeckaction
        type: (Elgato) Multi Action
        fields:
          - key: Step 1
            value: G
          - key: Step 2
            value: D
      - name: "Open a label ('gitlab' here)"
        icon: 1
        download: google_mail_label_gitlab-vdbrink.streamDeckAction
        type: (Elgato) Multi Action
        fields:
          - key: Step 1
            value: G
          - key: Step 2
            value: L
          - key: Step 3
            value: gitlab
    wishes:
      - name: Show the number of new inbox emails
      - name: Show the number of emails for a specific label
footnote: When keyboard shortcuts is enabled, then check this big list of <a href="https://support.google.com/mail/answer/6594?hl=en">Gmail keyboard shortcuts</a> you can map to your Stream Deck keys.
