title: Google Mail
key: google_mail
priority: 70
description: The Stream Deck can be used for Google Mail to fast filter on specific labels.
dependencies:
  - plugin: none
    actions:
      - name: Filter on unread mails
        icon: google_mail
        download: google_mail_label_unread-vdbrink.streamDeckAction
        type: (System) Text
        fields:
          - key: Title
            value: "label:unread"
          - key: Text
            value: "label:unread"
      - name: Filter on a specific label (`gitlab` in this example)
        icon: google_mail
        download: google_mail_label_any-vdbrink.streamDeckAction
        type: (System) Text
        fields:
          - key: Title
            value: "label:gitlab"
          - key: Text
            value: "label:gitlab"
      - name: Filter on spam mails
        icon: google_mail
        download: google_mail_in_spam-vdbrink.streamdeckaction
        type: (System) Text
        fields:
          - key: Title
            value: "in:spam"
          - key: Text
            value: "in:spam"
    wishes:
      - name: Show the number new inbox mails
      - name: Show the number of mails for a specific label