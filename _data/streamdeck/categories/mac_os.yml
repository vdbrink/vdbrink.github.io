title: MacOS
key: mac_os
priority: 110
description: The button actions here trigger basic macOS features.
dependencies:
  - plugin: none
    actions:
      - name: Lock PC
        icon: 1
        download: mac_os_lock_screen-vdbrink.streamDeckAction
        type: (System) Hotkey
        fields:
          - key: Title
            value: lock
          - key: Hotkey
            value: ⌃ ⌘ Q
      - name: Take a screenshot
        icon: 1
        download: mac_os_screen_shot-vdbrink.streamDeckAction
        type: (System) Hotkey
        fields:
          - key: Title
            value: screenshot
          - key: Hotkey
            value: ⇧ ⌘ 4
    wishes:
      - name: RSS reader
footnote: Check here for all <a href="https://support.apple.com/en-us/102650">Mac keyboard shortcuts</a>