title: Claude ai agent
key: claude_ai_agent
priority: 0
description: With the Stream Deck + Claude you can start Claude, paste predefined prompts, and run different skills, all with a single click.
  With the Jetstream plugin you can see for which project you run an active session and which one need attention.
dependencies:
  - plugin: none
    actions:
      - name: Start Claude
        icon: 1
        download: claude_code_start_macos-vdbrink.streamDeckAction
        type: (System) Text
        fields:
          - key: Title
            value: claude
          - key: Text
            value: claude
      - name: Past any prompt
        icon: 1
        download: claude_code_prompt-vdbrink.streamdeckaction
        type: (System) Text
        fields:
          - key: Title
            value: Any prompt
          - key: Text
            value: Any prompt
      - name: Run a skill
        icon: 1
        download: claude_run_skill.streamDeckAction
        type: (System) Text
        fields:
          - key: Title
            value: /my-skill
          - key: Text
            value: /my-skill
      - name: Auto mode - or any other default build-in command
        icon: 1
        download: claude_code_auto_mode-vdbrink.streamdeckaction
        type: (System) Text
        fields:
          - key: Title
            value: /auto
          - key: Text
            value: /auto
    footnote: Check here for all <a href="https://code.claude.com/docs/en/commands">Claude code commands</a>.

  - plugin: jetstream
    actions:
      - name: User input needed, visualisation per project
      - name: Still running visualisation per project
