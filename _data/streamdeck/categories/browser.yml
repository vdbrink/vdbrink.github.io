title: Browser
key: browser
priority: 10
description: Opening favorite links in a browser can easily be managed with bookmarks, you don't need a Stream Deck for it.
  The extra power comes when you want to combine it with selected text or use clipboard data in your search query.
dependencies:
  - plugin: none
    actions:
      - name: Open Google translate webpage with selected text
        icon: 1
        icon_border: false
        download: browser_translate_selected_text-vdbrink.streamdeckaction
        type: (System) Open Application
        fields:
          - key: Application
            value: Translate NL->EN
        requirements:
          - application: Apple Shortcut
            name: Translate NL->EN
            description: This Shortcut pastes the selected text into the Google Translate page.
            file: projects/shortcut_files/Translate NL-EN.shortcut
      - name: Go directly to a specific customer page