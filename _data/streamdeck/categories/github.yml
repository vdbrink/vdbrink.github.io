title: GitHub
key: github
priority: 50
description: Stream Deck + GitHub opens direct your open source software repositories.
dependencies:
  - plugin: none
    actions:
      - name: Notifications
        icon: 1
        download: github_notifications-vdbrink.streamdeckaction
        type: (System) Website
        fields:
          - key: Title
            value: Notifications
          - key: path
            value: "https://github.com/notifications"
      - name: Pull requests
        icon: 1
        download: github_pull_requests-vdbrink.streamdeckaction
        type: (System) Website
        fields:
          - key: Title
            value: Pull requests
          - key: path
            value: "https://github.com/pulls/inbox"
      - name: Issues
        icon: 1
        download: github_issues-vdbrink.streamdeckaction
        type: (System) Website
        fields:
          - key: Title
            value: Issues
          - key: path
            value: "https://github.com/issues/assigned"
footnote: Which pages do you use often yourself as well on GitHub?