title: GitLab
key: gitlab
priority: 60
description: Use the Stream Deck to go fast to all your different project sections for your GitHub projects.
dependencies:
  - plugin: gitlab-dashboard
    actions:
      - name: Open merge requests count
      - name: My merge request count
      - name: Open TODO count
    wishes:
      - name: Count based on specific branch names.
  - plugin: none
    actions:
      - name: Open project X
        icon: 1
        download: gitlab_open_project-vdbrink.streamDeckAction
        type: (System) Website
        fields:
          - key: Title
            value: Project X
          - key: path
            value: "https://gitlab.com/company/development/team/project/frontend"
    wishes:
      - name: Failed personal pipelines count
