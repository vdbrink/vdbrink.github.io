title: Chat
key: chat
priority: 30
description: You can create a Stream Deck profile linked to your chat apps, containing your frequently used text and icons
  for apps like WhatsApp, Instagram, Slack, etc.
dependencies:
  - plugin: none
    actions:
      - name: Have a nice day
        icon: 2
        download: chat_have_a_nice_day-vdbrink.streamDeckAction
        type: (System) Text
        fields:
          - key: Title
            value: Have a nice day
          - key: Text
            value: Have a nice day
      - name: Thank you
        icon: 2
        type: (System) Text
        fields:
          - key: Title
            value: Thank you
          - key: Text
            value:
              Thank you
      - name: LOL emoji
        icon: 1
        download: chat_lol_emoji-vdbrink.streamDeckAction
        type: (System) Text
        fields:
          - key: Title
            value: 😂
          - key: Text
            value: 😂
    wishes:
      - name: Button press to open an emoji keyboard where you can directly type to search for the icon you're looking for
  - plugin: emoji-keys
    actions:
      - name: Select any emoji from a big list and use that for a button.
        icon: 2
        type: (Emoji Keys) Emoji
        fields:
          - key: Text
            value: 😂
footnote: Download these and fill your own profile/page with your own text and emojis!