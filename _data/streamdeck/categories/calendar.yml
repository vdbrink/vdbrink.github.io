title: Calendar
key: calendar
description: Stream Deck button can be used as small display. This can show you quick the minutes before or still left in a meeting.
  The extra power with this plugin is that on button press it directs opens the meeting link!
dependencies:
  - plugin: next-meeting-countdown
    actions:
      - name: Time to next meeting
      - name: Time left in current meeting
      - name: Time since last meeting (not possible (yet) with this plugin)