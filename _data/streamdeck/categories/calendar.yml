title: Calendar
key: calendar
priority: 75
description: A Stream Deck button can be used as a small display, it quickly showing the minutes until your next meeting or the minutes left in the current one.
  The extra power of this plugin is that pressing the button directly opens the meeting link!
  See <a href="#google-meet">Google Meet</a> for its specific controls.
dependencies:
  - plugin: next-meeting-countdown
    actions:
      - name: Time left in current meeting
        icon: 1
        icon_border: false
        type: (Next Meeting Countdown) Current Meeting
        remark: Color change to amber and red closer to the end
      - name: Time to next meeting
        icon: 1
        icon_border: false
        type: (Next Meeting Countdown) Next Meeting
        remark: Color change to amber and red closer to the start
        requirements:
          - name: Grant calendar access
            application: macOS
            description: Allow Stream Deck access to your calendars in System Settings > Privacy & Security > Calendars
            image: next_meeting_grant_calendar
          - name: Both buttons together
            description: "\"Now\" and \"Next\" side by side in the Stream Deck app matching the macOS calendar events."
            image: next_meetings_calendar_buttons
          - name: Button settings
            image: next_meeting_color_settings
          - name: No upcoming meeting
            description: How the button looks when there is no next meeting.
            image: next_meeting_no_more_meetings
          - name: On the Stream Deck
            image: next_meeting_on_sd.jpg
            width: 500
    wishes:
      - name: Time since last meeting, so you can see how much time has passed since it ended