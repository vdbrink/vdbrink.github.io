title: IntelliJ Idea
key: intellij
priority: 100
description: Here are just a few example keyboard shortcuts for IntelliJ on macOS.<br>
  You can define any keyboard shortcut combination as key on your Stream Deck,
  for your own preferred IDE (VS Code, Eclipse, NetBeans, VIM, etc...)
dependencies:
  - plugin: none
    actions:
      - name: Open project
        icon: 1
        download: intellij_open_project_macos-vdbrink.streamdeckaction
        type: (System) Open
        fields:
          - key: Title
            value: Open project
          - key: path
            value: open -a "IntelliJ IDEA" /Users/me/my_project
      - name: Open terminal
        icon: 1
        download: intellij_open_terminal-vdbrink.streamDeckAction
        type: (System) Hotkey
        fields:
          - key: Title
            value: terminal
          - key: Hotkey
            value: F12
      - name: Clear console
        icon: 1
        download: intellij_clear_console_macos-vdbrink.streamDeckAction
        type: (System) Hotkey
        fields:
          - key: Title
            value: clear console
          - key: Hotkey
            value: ⌘ K
      - name: Next change
        icon: 1
        download: intellij_diff_next_change_macos-vdbrink.streamDeckAction
        type: (System) Hotkey
        fields:
          - key: Title
            value: next change
          - key: Hotkey
            value: F7
      - name: Next file
        icon: 1
        download: intellij_diff_next_file_macos-vdbrink.streamDeckAction
        type: (System) Hotkey
        fields:
          - key: Title
            value: next file
          - key: Hotkey
            value: ⌃ ⇧ →
      - name: Next diff
        icon: 1
        download: intellij_diff_next_macos-vdbrink.streamDeckAction
        type: (System) Hotkey
        fields:
          - key: Title
            value: next code
          - key: Hotkey
            value: ⌃ ⌥ ⇧ ↓
      - name: Optimize imports
        icon: 1
        download: intellij_optimize_imports_macos-vdbrink.streamDeckAction
        type: (System) Hotkey
        fields:
          - key: Title
            value: optimize import
          - key: Hotkey
            value: ⌥ ⌘ L
      - name: Previous difference
        icon: 1
        download: intellij_prev_difference_macos-vdbrink.streamDeckAction
        type: (System) Hotkey
        fields:
          - key: Title
            value: prev code
          - key: Hotkey
            value: ⌃ ⌥ ⇧ ↑
footnote: Check here for all <a href="https://www.jetbrains.com/help/idea/reference-keymap-mac-default.html">IntelliJ IDEA's keyboard shortcuts</a>.