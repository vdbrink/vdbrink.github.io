title: Spotify
key: spotify
priority: 120
description: With Spotify and Stream Deck you can recreate the regular audio controls on your Deck,
  an image of the cover of the currently played song, and extra shortcuts to predefined playlists.
dependencies:
  - plugin: spotify
    actions:
      - name: Play/Stop/Next
      - name: Volume control
      - name: Show currently played number
      - name: Show cover
      - name: Play specific playlist
