title: Spotify
key: spotify
priority: 120
description: With Spotify and Stream Deck you can create the regular audio controls on your Deck. 
  An image of the cover of the current played song and extra shortcuts to predefined playlist.
dependencies:
  - plugin: spotify
    actions:
      - name: Play/Stop/Next
      - name: Volume control
      - name: Show current played number
      - name: Show cover
      - name: Play specific playlist
