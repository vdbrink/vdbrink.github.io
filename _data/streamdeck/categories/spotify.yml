title: Spotify
key: spotify
priority: 120
description: With Spotify and Stream Deck you get your music controls on physical keys, so you don't need to switch to the Spotify app.
dependencies:
  - plugin: spotify
    image: spotify.png
    image_caption: Physical media player controls on your Stream Deck.
    actions:
      - name: Show the song that is playing
      - name: Volume control +/-
      - name: Previous song
      - name: Next song
      - name: Save to your Liked Songs
      - name: Play a specific playlist
      - name: Toggle repeat mode
footnote: Use the plugin to define these buttons.