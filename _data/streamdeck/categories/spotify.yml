# yaml-language-server: $schema=../../../schemas/streamdeck-category.schema.json
title: Spotify
key: spotify
priority: 120
description: With Spotify and Stream Deck you get your music controls on physical keys, so you don't need to switch to the Spotify app.
dependencies:
  - plugin: spotify
    image: spotify.png
    image_caption: "Physical media player controls on your Stream Deck.<br>
    <br>
    Actions:<br>
    Show the song that is playing<br>
    Volume control +/-<br>
    Previous song<br>
    Next song<br>
    Save to your Liked Songs<br>
    Play a specific playlist<br>
    Toggle repeat mode"
    actions: []
footnote: Use the plugin to select these buttons.